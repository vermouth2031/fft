name: Host checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q host scripts tests
      - name: Check UDP protocol and socket recovery
        run: python tests/test_host_protocol.py
      - name: Check independent digital waveform interval reference
        run: python tests/test_frame_length_reference.py
      - name: Check detector compatibility and record semantics
        run: python tests/test_detector_host.py
